name: Windows build

# Tauri can't cross-compile, so Windows installers are built here rather than
# on anyone's Mac.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      api_base:
        description: "API the build should talk to"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest

    env:
      # Baked into both halves of the app: the panel's fetches and the Rust
      # uploader. Set the HAUNTSHOT_API_BASE repo variable once the Worker is
      # deployed; until then builds point at a local API.
      API_BASE: ${{ inputs.api_base || vars.HAUNTSHOT_API_BASE || 'http://127.0.0.1:8787' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # Bump when the baked-in API base must not ride an old compile.
          prefix-key: hauntshot-win-v2

      - run: npm ci

      - name: Build installers
        run: npm run build:desktop
        env:
          VITE_API_BASE: ${{ env.API_BASE }}
          HAUNTSHOT_API_BASE: ${{ env.API_BASE }}

      # Catch a localhost bake-in before anyone downloads it. The Rust uploader
      # is what capture uses; the panel's Vite build is checked the same way.
      - name: Verify API base is baked in
        shell: pwsh
        run: |
          $base = $env:API_BASE
          if (-not $base -or $base -like '*127.0.0.1*') {
            throw "Refusing to ship a build aimed at '$base'"
          }
          $exe = Get-ChildItem -Recurse apps/desktop/src-tauri/target/release/desktop.exe |
            Select-Object -First 1
          if (-not $exe) { throw 'desktop.exe missing' }
          $haystack = [System.IO.File]::ReadAllBytes($exe.FullName)
          $needle = [System.Text.Encoding]::UTF8.GetBytes($base)
          $found = $false
          for ($i = 0; $i -le $haystack.Length - $needle.Length; $i++) {
            $ok = $true
            for ($j = 0; $j -lt $needle.Length; $j++) {
              if ($haystack[$i + $j] -ne $needle[$j]) { $ok = $false; break }
            }
            if ($ok) { $found = $true; break }
          }
          if (-not $found) {
            throw "desktop.exe does not contain baked-in API base: $base"
          }
          Write-Host "Baked-in API base confirmed: $base"

      - uses: actions/upload-artifact@v4
        with:
          name: hauntshot-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
